<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1120">
<title>Lecteur QR code</title>
<!-- Manifeste = la « carte d'identité » de l'appli (nom, icônes, plein écran) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">

<!-- jsQR : petite librairie qui décode un QR code à partir des pixels d'une image.
     On s'en sert en secours quand le téléphone n'a pas de détecteur natif. -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
/* Mise en page : une seule colonne façon appli, viseur en haut, résultat juste dessous, historique en bas. */
:root {
  --bg: #eef1f6;        /* fond : gris légèrement bleuté */
  --surface: #ffffff;   /* cartes */
  --ink: #141a2b;       /* texte principal */
  --muted: #5d6680;     /* texte secondaire */
  --line: #d6dbe6;      /* bordures fines */
  --accent: #2b50e0;    /* bleu cobalt : boutons, coins du viseur */
  --accent-ink: #ffffff;
  --ok: #1d8a5a;        /* vert « code trouvé » */
  --warn: #b5541c;      /* orange pour les erreurs */
  --viewfinder: #10162a;/* fond du viseur (toujours sombre) */
  --pop: #ffcf3f;       /* jaune « fun » : étiquette Trouvé, confettis */

  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* Thème sombre : on ne redéfinit que les couleurs (les « tokens »). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1120; --surface: #161d31; --ink: #e9ecf5; --muted: #98a1bb;
    --line: #283149; --accent: #6f8bff; --accent-ink: #0c1120;
    --ok: #4cc58f; --warn: #f0965c; --viewfinder: #05080f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1120; --surface: #161d31; --ink: #e9ecf5; --muted: #98a1bb;
  --line: #283149; --accent: #6f8bff; --accent-ink: #0c1120;
  --ok: #4cc58f; --warn: #f0965c; --viewfinder: #05080f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) 40px;
}
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.85rem; letter-spacing: -0.03em; margin: 0; }
/* Le « QR » du titre en couleur, un peu penché : petite touche ludique */
h1 span { color: var(--accent); display: inline-block; transform: rotate(-4deg); }
.sound {
  font: 500 .8rem var(--f-mono); padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
}

/* ---------- Viseur ---------- */
.viewfinder {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--viewfinder); border-radius: 22px; overflow: hidden;
  display: grid; place-items: center;
}
/* La vidéo live remplit le viseur (« cover » = recadrée, sans bandes noires) */
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* La « scène » contient l'image figée. Elle est positionnée et zoomée en JavaScript.
   transform-origin 0 0 : le zoom part du coin haut-gauche, ce qui simplifie les calculs. */
.stage { position: absolute; inset: 0; transform-origin: 0 0; }
.stage > * { position: absolute; }
/* Canvas transparent posé par-dessus : on y dessine l'encadrement et les confettis */
.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Les 4 coins du cadre de visée */
.frame { position: absolute; inset: 18%; pointer-events: none; transition: opacity .3s; }
.frame i { position: absolute; width: 28px; height: 28px; border: 3px solid var(--accent); }
.frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
.frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
.frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
/* Pendant la recherche, les coins « respirent » */
.viewfinder.scanning .frame { animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { inset: 21%; } }
/* Quand le code est trouvé, on cache le cadre fixe : l'encadrement se fait autour du vrai QR */
.viewfinder.found .frame { opacity: 0; }
/* Une fois le QR trouvé, le viseur devient « touchable » pour zoomer / dézoomer */
.viewfinder.found { cursor: zoom-out; }
/* Barre de zoom : − [curseur] + ×2.0 */
.zoombar { display: flex; align-items: center; gap: 10px; margin-top: -8px; }
.zoombar button { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 1.3rem; line-height: 1; flex: none; }
.zoombar input { flex: 1; min-width: 0; accent-color: var(--accent); height: 32px; }
.zoombar output { font: 500 .85rem var(--f-mono); color: var(--muted); width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
/* Pendant le live, on empêche le navigateur de zoomer la page quand on pince le viseur */
.viewfinder.live { touch-action: none; }
.viewfinder video { transform-origin: center; }
.zoom-hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  font: 500 .78rem var(--f-body); color: #e9ecf5; white-space: nowrap;
  background: rgba(5, 8, 15, .7); padding: 5px 12px; border-radius: 999px; pointer-events: none;
}
/* Ligne de balayage */
.scanline {
  position: absolute; left: 18%; right: 18%; height: 3px; top: 18%; border-radius: 3px;
  background: var(--accent); box-shadow: 0 0 16px 2px var(--accent);
  animation: sweep 1.6s ease-in-out infinite alternate;
}
@keyframes sweep { to { top: 82%; } }
/* Pas de code trouvé : le viseur fait « non » de la tête */
.viewfinder.nope { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

.idle { position: relative; text-align: center; color: #c7cee3; padding: 0 24%; font-size: .95rem; }
.idle svg { width: 56px; height: 56px; display: block; margin: 0 auto 10px; opacity: .8; }

/* ---------- Boutons ---------- */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button, .btn {
  font: 600 1rem var(--f-body); border-radius: 14px; padding: 14px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: transform .12s;
}
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button:focus-visible, .btn:focus-visible, label.btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
button:active, .btn:active { transform: scale(.96); }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

.status { font-size: .9rem; color: var(--muted); min-height: 1.5em; margin: -8px 0 0; }
.status.err { color: var(--warn); }

/* ---------- Résultat ---------- */
.result {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
/* La carte arrive en rebondissant depuis le bas */
.result.show { animation: popin .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes popin { from { opacity: 0; transform: translateY(24px) scale(.94); } }
/* Pastille du type de contenu : une couleur par type */
.kind {
  align-self: flex-start; font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; background: var(--ok); color: var(--accent-ink);
}
.kind[data-k="Lien"] { background: var(--accent); }
.kind[data-k="Wi-Fi"] { background: #8a5cf6; color: #fff; }
.kind[data-k="Contact"], .kind[data-k="E-mail"], .kind[data-k="Téléphone"] { background: #d9466f; color: #fff; }
.result .content {
  font-family: var(--f-mono); font-size: .95rem; word-break: break-word; white-space: pre-wrap;
  margin: 0; min-width: 0; user-select: all;
}
.result .row { display: flex; flex-wrap: wrap; gap: 8px; }
.result .row > * { flex: 1 1 140px; padding: 11px 14px; font-size: .95rem; }

/* ---------- Historique ---------- */
h2 { font-family: var(--f-display); font-weight: 500; font-size: 1.1rem; margin: 0; }
.hist-head { display: flex; justify-content: space-between; align-items: center; }
.hist-head button { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
ul.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
ul.history li { border-bottom: 1px solid var(--line); }
ul.history button {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; padding: 12px 2px;
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline;
}
ul.history button:focus-visible { outline: 2px solid var(--accent); }
.h-text { font-family: var(--f-mono); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.h-time { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Si le téléphone demande moins d'animations, on les coupe */
@media (prefers-reduced-motion: reduce) {
  .scanline, .viewfinder.scanning .frame, .viewfinder.nope, .result.show { animation: none; }
  .scanline { top: 50%; }
}

/* =====================================================================
   ÉCRAN DE LANCEMENT (« splash ») — animation de ~1,6 s à l'ouverture.
   Il couvre tout l'écran, rejoue l'icône de l'appli, puis s'efface.
   La caméra démarre déjà en dessous pendant ce temps : on ne perd rien.
   ===================================================================== */
.splash {
  position: fixed; inset: 0; z-index: 1000;        /* par-dessus tout */
  background: #06343a;                             /* même vert foncé que l'icône */
  display: grid; place-items: center; align-content: center; gap: 18px;
  /* Disparition : fondu + léger zoom, lancé après 1,3 s */
  animation: splash-out .45s ease-in 1.3s forwards;
}
.splash svg { width: 132px; height: 132px; overflow: visible; }
.splash p {
  margin: 0; color: #c9fff2; font: 700 1.3rem var(--f-display); letter-spacing: -.02em;
  opacity: 0; animation: rise .4s ease-out .75s forwards;   /* le titre arrive en dernier */
}

/* Les 4 coins du viseur glissent depuis l'extérieur vers leur place */
.splash .corner { opacity: 0; animation: corner-in .45s cubic-bezier(.2,1.4,.4,1) forwards; }
.splash .c1 { --dx: -14px; --dy: -14px; }   /* haut-gauche : vient d'en haut à gauche */
.splash .c2 { --dx:  14px; --dy: -14px; }
.splash .c3 { --dx: -14px; --dy:  14px; }
.splash .c4 { --dx:  14px; --dy:  14px; }

/* Les carrés du QR « poppent » un par un (le délai est donné dans le HTML via --d) */
.splash .px {
  transform-box: fill-box; transform-origin: center;   /* chaque carré grossit depuis son centre */
  transform: scale(0); animation: pop .3s cubic-bezier(.3,1.6,.5,1) var(--d) forwards;
}

/* Le trait de scan descend une fois de haut en bas */
.splash .scan { opacity: 0; animation: scan .6s ease-in-out .55s forwards; }

@keyframes corner-in { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } to { opacity: 1; transform: none; } }
@keyframes pop       { to { transform: scale(1); } }
@keyframes scan      { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(64px); } }
@keyframes rise      { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes splash-out { to { opacity: 0; transform: scale(1.06); visibility: hidden; } }

/* Accessibilité : si le téléphone demande « moins d'animations », on montre l'écran
   sans mouvement et on l'efface plus vite. */
@media (prefers-reduced-motion: reduce) {
  .splash, .splash * { animation-duration: .01s !important; animation-delay: 0s !important; }
  .splash { animation: splash-out .2s linear .5s forwards !important; }
}
</style>
</head>
<body>
<!-- Écran de lancement : l'icône de l'appli dessinée en SVG (dessin vectoriel),
     chaque morceau a sa propre animation définie dans le CSS ci-dessus. -->
<div class="splash" id="splash" aria-hidden="true">
  <svg viewBox="0 0 120 120">
    <!-- 4 coins du viseur (couleur turquoise de l'icône) -->
    <g fill="none" stroke="#2fe0c8" stroke-width="7" stroke-linecap="square">
      <path class="corner c1" d="M8 30V8h22"/>
      <path class="corner c2" d="M90 8h22v22" style="animation-delay:.08s"/>
      <path class="corner c3" d="M8 90v22h22" style="animation-delay:.16s"/>
      <path class="corner c4" d="M112 90v22H90" style="animation-delay:.24s"/>
    </g>
    <!-- Les 3 « yeux » du QR code : cadre clair + centre turquoise.
         --d = délai avant l'apparition, pour un effet en cascade. -->
    <g>
      <rect class="px" style="--d:.30s" x="34" y="34" width="22" height="22" fill="none" stroke="#c9fff2" stroke-width="4"/>
      <rect class="px" style="--d:.36s" x="41" y="41" width="8" height="8" fill="#2fe0c8"/>
      <rect class="px" style="--d:.40s" x="64" y="34" width="22" height="22" fill="none" stroke="#c9fff2" stroke-width="4"/>
      <rect class="px" style="--d:.46s" x="71" y="41" width="8" height="8" fill="#2fe0c8"/>
      <rect class="px" style="--d:.50s" x="34" y="64" width="22" height="22" fill="none" stroke="#c9fff2" stroke-width="4"/>
      <rect class="px" style="--d:.56s" x="41" y="71" width="8" height="8" fill="#2fe0c8"/>
      <!-- Petits pixels en damier, en bas à droite -->
      <rect class="px" style="--d:.60s" x="64" y="64" width="7" height="7" fill="#2fe0c8"/>
      <rect class="px" style="--d:.64s" x="79" y="64" width="7" height="7" fill="#c9fff2"/>
      <rect class="px" style="--d:.68s" x="71.5" y="71.5" width="7" height="7" fill="#c9fff2"/>
      <rect class="px" style="--d:.72s" x="64" y="79" width="7" height="7" fill="#c9fff2"/>
      <rect class="px" style="--d:.76s" x="79" y="79" width="7" height="7" fill="#2fe0c8"/>
    </g>
    <!-- Trait de scan qui balaie le QR une fois -->
    <rect class="scan" x="26" y="28" width="68" height="3" rx="1.5" fill="#2fe0c8"/>
  </svg>
  <p>Lecteur QR code</p>
</div>
<script>
  // Quand l'animation de sortie est finie, on retire l'écran de la page
  // pour qu'il ne bloque plus les doigts (sinon il resterait invisible par-dessus).
  document.getElementById("splash").addEventListener("animationend", (e) => {
    if (e.animationName === "splash-out") e.currentTarget.remove();
  });
</script>
<div class="app">
  <header>
    <h1>Lecteur <span>QR</span> code</h1>
    <button class="sound" id="sound" type="button" aria-pressed="false">son : non</button>
  </header>

  <div class="viewfinder" id="vf">
    <div class="stage" id="stage"></div>
    <canvas class="overlay" id="overlay"></canvas>
    <div class="idle" id="idle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>
        <rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/>
      </svg>
      <span>Démarrage de la caméra…</span>
    </div>
    <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <span class="zoom-hint" id="zoomHint" hidden>Toucher pour dézoomer</span>
  </div>

  <!-- Zoom de la caméra (visible seulement en live) -->
  <div class="zoombar" id="zoombar" hidden>
    <button type="button" id="zoomOut" aria-label="Dézoomer">−</button>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" aria-label="Zoom de la caméra">
    <button type="button" id="zoomIn" aria-label="Zoomer">+</button>
    <output id="zoomVal" for="zoom">×1.0</output>
  </div>

  <div class="actions">
    <!-- Pas d'attribut « capture » : le téléphone ouvre la galerie pour choisir une photo existante -->
    <label class="btn" for="photo">
      Galerie
      <input type="file" id="photo" accept="image/*">
    </label>
    <button id="live" class="primary" type="button">Caméra live</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <section class="result" id="result" hidden>
    <span class="kind" id="kind">Texte</span>
    <p class="content" id="content"></p>
    <div class="row">
      <button id="copy" type="button">Copier</button>
      <a class="btn primary" id="open" target="_blank" rel="noopener" hidden>Ouvrir le lien</a>
    </div>
  </section>

  <section>
    <div class="hist-head">
      <h2>Historique</h2>
      <button id="clear" type="button">Effacer</button>
    </div>
    <ul class="history" id="history"></ul>
  </section>
</div>

<script>
/* =====================================================================
   LECTEUR QR — fonctionnement général
   1. On récupère une image (photo de la galerie, ou image de la vidéo).
   2. On cherche un QR code dedans, et SURTOUT sa position (ses 4 coins) :
        - d'abord avec BarcodeDetector (détecteur intégré à Chrome Android)
        - sinon avec jsQR (librairie JavaScript)
   3. Animation « trouvé » : on fige l'image, on zoome sur le QR, on l'encadre,
      on assombrit le reste, confettis + petit son.
   4. On affiche le contenu (Copier / Ouvrir) et on l'ajoute à l'historique.
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const vf = $("vf"), stage = $("stage"), overlay = $("overlay"), idle = $("idle"), statusEl = $("status");
const octx = overlay.getContext("2d");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Détecteur natif (si le téléphone en a un) ---------- */
let nativeDetector = null;
if ("BarcodeDetector" in window) {
  try { nativeDetector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { /* pas dispo */ }
}

/* Canvas « de travail » invisible : on y dessine l'image pour lire ses pixels */
const work = document.createElement("canvas");
const wctx = work.getContext("2d", { willReadFrequently: true });

/**
 * Cherche un QR code dans une source (image, canvas ou vidéo) de taille w × h.
 * Renvoie { text, points } où points = les 4 coins du QR dans les coordonnées
 * de la source d'origine, ou null si rien n'est trouvé.
 */
async function decode(source, w, h, maxSide = 1000) {
  // 1) Détecteur natif : il donne directement les coins (cornerPoints)
  if (nativeDetector) {
    try {
      const codes = await nativeDetector.detect(source);
      if (codes.length) return { text: codes[0].rawValue, points: codes[0].cornerPoints };
    } catch (e) { /* on passe au plan B */ }
  }
  // 2) jsQR : on réduit l'image (plus rapide), donc on devra « re-agrandir » les coins après
  if (typeof jsQR !== "function") return null;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  work.width = Math.round(w * scale);
  work.height = Math.round(h * scale);
  wctx.drawImage(source, 0, 0, work.width, work.height);
  const px = wctx.getImageData(0, 0, work.width, work.height);
  const code = jsQR(px.data, px.width, px.height, { inversionAttempts: "attemptBoth" });
  if (!code) return null;
  const L = code.location;
  // On divise par « scale » pour revenir aux coordonnées de l'image d'origine
  const points = [L.topLeftCorner, L.topRightCorner, L.bottomRightCorner, L.bottomLeftCorner]
    .map((p) => ({ x: p.x / scale, y: p.y / scale }));
  return { text: code.data, points };
}

/* =====================================================================
   AFFICHAGE DANS LE VISEUR
   ===================================================================== */

// Ajuste le canvas overlay à la taille réelle du viseur (et à la densité de l'écran,
// sinon les traits seraient flous sur un téléphone).
function sizeOverlay() {
  const dpr = window.devicePixelRatio || 1;
  overlay.width = vf.clientWidth * dpr;
  overlay.height = vf.clientHeight * dpr;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);   // on dessine ensuite en pixels « CSS »
}

/**
 * Place un élément (image ou canvas) dans la scène en mode « cover » :
 * il remplit tout le viseur, quitte à déborder. Renvoie l'échelle et le décalage,
 * qui servent à convertir les coordonnées de l'image en coordonnées écran.
 */
function placeCover(el, iw, ih) {
  const W = vf.clientWidth, H = vf.clientHeight;
  const s = Math.max(W / iw, H / ih);
  const ox = (W - iw * s) / 2, oy = (H - ih * s) / 2;
  Object.assign(el.style, { width: iw * s + "px", height: ih * s + "px", left: ox + "px", top: oy + "px" });
  return { s, ox, oy };
}

// Remet le viseur à zéro (enlève image figée, zoom, dessins)
let animId = 0;
function resetView() {
  cancelAnimationFrame(animId);
  stage.innerHTML = "";
  stage.style.transform = "";
  vf.classList.remove("found", "nope");
  view = null;
  $("zoomHint").hidden = true;
  $("zoomHint").textContent = "Toucher pour dézoomer";
  sizeOverlay();
  octx.clearRect(0, 0, overlay.width, overlay.height);
}

function startScanFx() {
  vf.classList.add("scanning");
  if (!vf.querySelector(".scanline")) {
    const line = document.createElement("div");
    line.className = "scanline";
    vf.appendChild(line);
  }
}
function stopScanFx() {
  vf.classList.remove("scanning");
  vf.querySelector(".scanline")?.remove();
}

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", isError);
}

/* =====================================================================
   L'ANIMATION « TROUVÉ ! »
   el = l'image figée (déjà dans la scène), iw/ih = sa taille, pts = coins du QR
   ===================================================================== */
const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2); // léger rebond
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2); // doux au début et à la fin
const CONFETTI = ["#ffcf3f", "#ff6b9a", "#6f8bff", "#4cc58f", "#7fe0ff", "#ff9f43"];

/* « view » garde tout ce qu'il faut pour redessiner la scène à n'importe quel niveau de zoom :
   P = coins du QR à l'écran (sans zoom), k = zoom maximal, tx/ty = décalage au zoom maximal,
   e = où on en est entre « pas zoomé » (0) et « zoomé » (1). */
let view = null;
let particles = null;

/**
 * Dessine toute la scène pour une progression de zoom e (0 → 1).
 * showLabel : afficher l'étiquette « Trouvé ! » (0 = cachée, 1 = visible, entre les deux = apparition)
 */
function drawScene(e, showLabel, pulse) {
  const { P, k, tx, ty, W, H, ok, pop } = view;
  const z = 1 + (k - 1) * e;                // zoom courant
  const dx = tx * e, dy = ty * e;           // translation courante

  // Le zoom de l'image se fait en CSS (fluide, géré par la carte graphique)
  stage.style.transform = `translate(${dx}px, ${dy}px) scale(${z})`;

  // Les coins suivent la même transformation : point écran = point × zoom + translation
  const Q = P.map((p) => ({ x: p.x * z + dx, y: p.y * z + dy }));
  octx.clearRect(0, 0, W, H);

  // a) Voile sombre partout SAUF sur le QR (règle « evenodd » = on troue le rectangle)
  octx.beginPath();
  octx.rect(0, 0, W, H);
  Q.forEach((p, i) => (i ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y)));
  octx.closePath();
  octx.fillStyle = "rgba(5, 8, 15, 0.6)";
  octx.fill("evenodd");

  // b) Contour du QR, avec un halo (plus ou moins fort selon « pulse »)
  octx.save();
  octx.beginPath();
  Q.forEach((p, i) => (i ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y)));
  octx.closePath();
  octx.lineJoin = "round";
  octx.strokeStyle = ok;
  octx.lineWidth = 3;
  octx.shadowColor = ok;
  octx.shadowBlur = 8 + 12 * pulse;
  octx.stroke();
  octx.restore();

  // c) Gros coins façon viseur, posés sur les 4 coins du QR, un peu à l'extérieur
  const qc = { x: Q.reduce((a, p) => a + p.x, 0) / 4, y: Q.reduce((a, p) => a + p.y, 0) / 4 };
  octx.strokeStyle = ok;
  octx.lineWidth = 5;
  octx.lineCap = "round";
  Q.forEach((p, i) => {
    const c = { x: p.x + (p.x - qc.x) * 0.08, y: p.y + (p.y - qc.y) * 0.08 }; // écarté de 8 %
    const prev = Q[(i + 3) % 4], next = Q[(i + 1) % 4];
    const arm = 0.22; // longueur des « bras » = 22 % du côté
    octx.beginPath();
    octx.moveTo(c.x + (prev.x - p.x) * arm, c.y + (prev.y - p.y) * arm);
    octx.lineTo(c.x, c.y);
    octx.lineTo(c.x + (next.x - p.x) * arm, c.y + (next.y - p.y) * arm);
    octx.stroke();
  });

  // d) Étiquette « Trouvé ! » au-dessus du QR
  if (showLabel > 0) {
    const top = Math.min(...Q.map((p) => p.y));
    const ly = Math.max(26, top - 22) - 14 * (1 - easeOutBack(showLabel));
    octx.save();
    octx.globalAlpha = showLabel;
    octx.font = "800 16px 'Bricolage Grotesque', sans-serif";
    const label = "Trouvé !";
    const tw = octx.measureText(label).width + 24;
    octx.translate(qc.x, ly);
    octx.rotate(-0.06);                       // légèrement penchée, pour le côté fun
    octx.fillStyle = pop;
    octx.beginPath();
    octx.roundRect(-tw / 2, -15, tw, 30, 15);
    octx.fill();
    octx.fillStyle = "#141a2b";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText(label, 0, 1);
    octx.restore();
  }

  // e) Confettis (seulement pendant l'animation d'arrivée)
  if (particles) {
    for (const p of particles) {
      p.vy += 0.15;                 // gravité
      p.vx *= 0.985;                // frottement de l'air
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life -= 0.008;
      if (p.life <= 0) continue;
      octx.save();
      octx.globalAlpha = Math.min(1, p.life * 2);
      octx.translate(p.x, p.y);
      octx.rotate(p.r);
      octx.fillStyle = p.c;
      octx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      octx.restore();
    }
  }
  return qc;
}

/* L'animation « Trouvé ! » : el = l'image figée (déjà dans la scène), iw/ih = sa taille, pts = coins du QR */
function celebrate(el, iw, ih, pts) {
  vf.classList.add("found");
  sizeOverlay();
  const W = vf.clientWidth, H = vf.clientHeight;
  const { s, ox, oy } = placeCover(el, iw, ih);

  // 1) Coins du QR en coordonnées écran (avant zoom)
  const P = pts.map((p) => ({ x: ox + p.x * s, y: oy + p.y * s }));
  const xs = P.map((p) => p.x), ys = P.map((p) => p.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const size = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));

  // 2) Zoom visé : le QR doit occuper ~60 % du viseur (entre ×1 et ×5)
  const k = Math.min(5, Math.max(1, (0.6 * W) / size));
  const css = getComputedStyle(document.documentElement);
  view = {
    P, k, W, H,
    tx: W / 2 - cx * k, ty: H / 2 - cy * k,  // amène le centre du QR au centre du viseur
    ok: css.getPropertyValue("--ok").trim() || "#4cc58f",
    pop: css.getPropertyValue("--pop").trim() || "#ffcf3f",
    e: 1,
  };
  particles = null;
  $("zoomHint").hidden = k < 1.15;           // zoom inutile si le QR remplit déjà l'image

  const ZOOM_MS = reducedMotion ? 0 : 700;
  const t0 = performance.now();
  function frame(now) {
    const elapsed = now - t0;
    const t = ZOOM_MS ? Math.min(1, elapsed / ZOOM_MS) : 1;
    const labelT = t >= 1 ? Math.min(1, (elapsed - ZOOM_MS) / 350) : 0;
    // Les confettis sont créés une seule fois, quand le zoom est terminé
    if (t >= 1 && !particles && !reducedMotion) {
      const qc = { x: W / 2, y: H / 2 };
      particles = Array.from({ length: 60 }, () => {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
        return {
          x: qc.x, y: qc.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
          r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
          c: CONFETTI[(Math.random() * CONFETTI.length) | 0], life: 1,
        };
      });
    }
    drawScene(easeOutBack(t), labelT, 0.5 + 0.5 * Math.sin(elapsed / 180));
    // On anime pendant 3 s, puis on s'arrête : la dernière image reste affichée,
    // et le processeur peut se reposer.
    if (elapsed < 3000) animId = requestAnimationFrame(frame);
    else { particles = null; drawScene(1, 1, 0.5); }
  }
  animId = requestAnimationFrame(frame);
}

/* Zoom / dézoom à la demande : un toucher sur le viseur bascule entre
   « zoomé sur le QR » et « image entière » (le QR reste encadré dans les deux cas). */
function toggleZoom() {
  if (!view || !vf.classList.contains("found") || view.k < 1.15) return;
  cancelAnimationFrame(animId);
  particles = null;
  const from = view.e, to = view.e > 0.5 ? 0 : 1;
  const MS = reducedMotion ? 0 : 450;
  const t0 = performance.now();
  function frame(now) {
    const t = MS ? Math.min(1, (now - t0) / MS) : 1;
    view.e = from + (to - from) * easeInOut(t);
    drawScene(view.e, 1, 0.5);
    if (t < 1) animId = requestAnimationFrame(frame);   // s'arrête dès que c'est fini
  }
  animId = requestAnimationFrame(frame);
  $("zoomHint").textContent = to ? "Toucher pour dézoomer" : "Toucher pour zoomer";
}
vf.addEventListener("click", toggleZoom);

/* ---------- Petit « ding » (synthétisé, pas de fichier son) ---------- */
let audio = null;
let soundOn = false;
try { soundOn = localStorage.getItem("qr-sound") === "on"; } catch (e) {} // coupé par défaut
function updateSoundBtn() {
  $("sound").textContent = soundOn ? "son : oui" : "son : non";
  $("sound").setAttribute("aria-pressed", String(soundOn));
}
$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem("qr-sound", soundOn ? "on" : "off"); } catch (e) {}
  updateSoundBtn();
});
updateSoundBtn();

function ding() {
  if (!soundOn) return;
  try {
    audio = audio || new AudioContext();
    audio.resume();
    // Deux notes qui montent (do puis sol aigu) : un oscillateur par note
    [[1046.5, 0], [1568, 0.09]].forEach(([freq, delay]) => {
      const t = audio.currentTime + delay;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);   // attaque rapide
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); // extinction douce
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  } catch (e) { /* pas de son, pas grave */ }
}

/* =====================================================================
   MODE 1 : GALERIE
   ===================================================================== */
$("photo").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  stopCamera();
  resetView();
  $("result").hidden = true;
  idle.hidden = true;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  stage.appendChild(img);
  placeCover(img, img.naturalWidth, img.naturalHeight);
  setStatus("Recherche du QR code…");
  startScanFx();

  // On laisse le balayage tourner au moins 0,7 s : c'est plus lisible (et plus fun)
  const minDelay = new Promise((r) => setTimeout(r, reducedMotion ? 0 : 700));
  let res = null;
  for (const size of [1000, 1600, 2400]) {           // plusieurs résolutions si besoin
    res = await decode(img, img.naturalWidth, img.naturalHeight, size);
    if (res) break;
  }
  await minDelay;
  stopScanFx();
  e.target.value = "";                               // permet de rechoisir la même photo

  if (res) {
    celebrate(img, img.naturalWidth, img.naturalHeight, res.points);
    found(res.text);
  } else {
    vf.classList.remove("nope"); void vf.offsetWidth; vf.classList.add("nope"); // relance l'animation
    setStatus("Aucun QR code trouvé. Essaie une photo plus nette ou plus proche.", true);
  }
});

/* =====================================================================
   MODE 2 : CAMÉRA LIVE
   ===================================================================== */
let stream = null, video = null, looping = false;

$("live").addEventListener("click", () => (stream ? stopCamera() : startCamera()));

async function startCamera() {
  if (stream) return;
  resetView();
  $("result").hidden = true;
  try {
    // facingMode "environment" = caméra arrière.
    // 720 px suffisent largement pour un QR code, et ça chauffe beaucoup moins que 1280.
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 720 }, height: { ideal: 720 } },
    });
  } catch (err) {
    idle.hidden = false;
    idle.querySelector("span").textContent = "Caméra indisponible";
    setStatus("Impossible d'accéder à la caméra. Autorise-la dans le navigateur, ou utilise « Galerie ».", true);
    return;
  }
  video = document.createElement("video");
  video.setAttribute("playsinline", "");          // indispensable sur iPhone
  video.muted = true;
  video.srcObject = stream;
  await video.play();
  idle.hidden = true;
  vf.prepend(video);
  vf.classList.add("live");
  setupZoom();
  startScanFx();
  $("live").textContent = "Arrêter";
  setStatus("Vise le QR code…");
  looping = true;
  scanStarted = Date.now();
  scanLoop();
}

// Boucle : on analyse une image vidéo toutes les ~250 ms (4 fois par seconde, c'est assez)
const IDLE_LIMIT = 45000;      // au bout de 45 s sans QR, on met la caméra en pause
let scanStarted = 0;
async function scanLoop() {
  if (!looping || !video) return;
  if (Date.now() - scanStarted > IDLE_LIMIT) {
    stopCamera();
    idle.hidden = false;
    idle.querySelector("span").textContent = "Caméra en pause";
    $("live").textContent = "Relancer la caméra";
    setStatus("Caméra mise en pause pour économiser la batterie.");
    return;
  }
  if (video.readyState >= 2) {
    const vw = video.videoWidth, vh = video.videoHeight;
    let res;
    if (zoom.hardware || zoom.level <= 1) {
      // Zoom matériel (ou pas de zoom) : l'image de la caméra est déjà « zoomée »
      res = await decode(video, vw, vh, 480);     // image réduite = analyse plus légère
    } else {
      // Zoom numérique : on n'analyse QUE la zone visible au centre, sans la réduire.
      // Le QR y paraît plus gros, donc il est plus facile à lire.
      const side = Math.min(vw, vh) / zoom.level;
      const sx = (vw - side) / 2, sy = (vh - side) / 2;
      cropC.width = cropC.height = Math.round(side);
      cropC.getContext("2d").drawImage(video, sx, sy, side, side, 0, 0, cropC.width, cropC.height);
      res = await decode(cropC, cropC.width, cropC.height, 800);
      // Les coins trouvés sont dans le morceau découpé : on les replace dans l'image entière
      if (res) res.points = res.points.map((p) => ({ x: p.x + sx, y: p.y + sy }));
    }
    if (res && looping) {
      // On « photographie » l'image vidéo exacte où le QR a été lu, pour la figer
      const snap = document.createElement("canvas");
      snap.width = vw; snap.height = vh;
      snap.getContext("2d").drawImage(video, 0, 0);
      stopCamera();
      stage.appendChild(snap);
      celebrate(snap, vw, vh, res.points);
      found(res.text);
      $("live").textContent = "Scanner à nouveau";
      return;
    }
  }
  setTimeout(scanLoop, 250);
}

/* =====================================================================
   ZOOM AVANT DÉTECTION
   Deux façons de zoomer :
   - zoom MATÉRIEL : on demande au capteur de zoomer (applyConstraints).
     C'est le meilleur, car l'image garde tous ses détails. Chrome Android le permet
     sur la plupart des téléphones.
   - zoom NUMÉRIQUE (si le téléphone ne sait pas) : on agrandit la vidéo en CSS
     et on n'analyse que le centre de l'image.
   ===================================================================== */
const zoom = { level: 1, min: 1, max: 4, hardware: false, track: null };
const cropC = document.createElement("canvas");   // canvas pour le morceau découpé

function setupZoom() {
  zoom.track = stream.getVideoTracks()[0];
  // getCapabilities() dit ce que la caméra sait faire, dont le zoom (min, max, pas)
  const caps = zoom.track.getCapabilities ? zoom.track.getCapabilities() : {};
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    zoom.hardware = true;
    zoom.min = caps.zoom.min;
    zoom.max = Math.min(caps.zoom.max, 10);         // au-delà de ×10 l'image tremble trop
  } else {
    zoom.hardware = false;
    zoom.min = 1;
    zoom.max = 4;
  }
  const r = $("zoom");
  r.min = zoom.min; r.max = zoom.max; r.step = 0.1;
  setZoom(zoom.min);
  $("zoombar").hidden = false;
}

function setZoom(z) {
  z = Math.min(zoom.max, Math.max(zoom.min, z));
  zoom.level = z;
  $("zoom").value = z;
  $("zoomVal").textContent = "×" + z.toFixed(1);
  if (zoom.hardware) {
    zoom.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else if (video) {
    video.style.transform = `scale(${z})`;          // agrandit l'image depuis son centre
  }
  scanStarted = Date.now();                        // on bouge le zoom = on est là : pas de mise en pause
}

$("zoom").addEventListener("input", (e) => setZoom(parseFloat(e.target.value)));
$("zoomIn").addEventListener("click", () => setZoom(zoom.level * 1.25));
$("zoomOut").addEventListener("click", () => setZoom(zoom.level / 1.25));

/* Pincer le viseur avec deux doigts pour zoomer, comme dans l'appareil photo.
   On suit chaque doigt (pointerId) ; le rapport entre l'écart actuel des deux doigts
   et l'écart au début du geste donne le facteur de zoom. */
const fingers = new Map();
let pinch = null;
const gap = () => { const [a, b] = [...fingers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
vf.addEventListener("pointerdown", (e) => {
  if (!looping) return;
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fingers.size === 2) pinch = { start: gap(), level: zoom.level };
});
vf.addEventListener("pointermove", (e) => {
  if (!fingers.has(e.pointerId)) return;
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && fingers.size === 2) setZoom(pinch.level * (gap() / pinch.start));
});
const lift = (e) => { fingers.delete(e.pointerId); if (fingers.size < 2) pinch = null; };
vf.addEventListener("pointerup", lift);
vf.addEventListener("pointercancel", lift);

function stopCamera() {
  looping = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());   // éteint vraiment la caméra
  stream = null;
  video?.remove();
  video = null;
  vf.classList.remove("live");
  $("zoombar").hidden = true;
  stopScanFx();
  $("live").textContent = "Caméra live";
}

/* =====================================================================
   RÉSULTAT
   ===================================================================== */
// Devine le type de contenu pour adapter l'étiquette et le bouton
function classify(text) {
  if (/^https?:\/\//i.test(text)) return { kind: "Lien", url: text };
  if (/^WIFI:/i.test(text)) {
    // Format WiFi standard : WIFI:T:WPA;S:NomDuReseau;P:MotDePasse;;
    const ssid = (text.match(/S:([^;]*)/) || [])[1] || "?";
    const pass = (text.match(/P:([^;]*)/) || [])[1] || "";
    return { kind: "Wi-Fi", display: `Réseau : ${ssid}\nMot de passe : ${pass}`, copy: pass };
  }
  if (/^mailto:/i.test(text)) return { kind: "E-mail", display: text.slice(7) };
  if (/^tel:/i.test(text)) return { kind: "Téléphone", display: text.slice(4) };
  if (/^BEGIN:VCARD/i.test(text)) return { kind: "Contact" };
  return { kind: "Texte" };
}

let currentCopy = "";
function showResult(text) {
  const info = classify(text);
  $("kind").textContent = info.kind;
  $("kind").dataset.k = info.kind;            // sert au CSS pour la couleur de la pastille
  $("content").textContent = info.display || text;
  currentCopy = info.copy || info.display || text;
  $("copy").textContent = info.kind === "Wi-Fi" ? "Copier le mot de passe" : "Copier";
  const open = $("open");
  open.hidden = !info.url;
  if (info.url) open.href = info.url;
  const card = $("result");
  card.hidden = false;
  card.classList.remove("show"); void card.offsetWidth; card.classList.add("show"); // rejoue l'animation
}

function found(text) {
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);   // double petite vibration
  ding();
  setStatus("QR code lu ✓");
  showResult(text);
  addToHistory(text);
}

/* ---------- Copier ---------- */
$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(currentCopy);
    setStatus("Copié dans le presse-papiers");
  } catch (e) {
    // Plan B : on sélectionne le texte pour que tu puisses faire « Copier » à la main
    const range = document.createRange();
    range.selectNodeContents($("content"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    setStatus("Texte sélectionné : appuie longuement pour copier");
  }
});

/* =====================================================================
   HISTORIQUE (stocké dans ce navigateur uniquement)
   ===================================================================== */
const KEY = "qr-history";
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function saveHistory(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { /* stockage indisponible */ }
}
let history = loadHistory();

function addToHistory(text) {
  history = history.filter((h) => h.text !== text);  // pas de doublon
  history.unshift({ text, t: Date.now() });
  history = history.slice(0, 30);                     // 30 derniers max
  saveHistory(history);
  renderHistory();
}

function renderHistory() {
  const ul = $("history");
  ul.innerHTML = "";
  if (!history.length) {
    ul.innerHTML = '<li style="padding:12px 2px;color:var(--muted)">Rien pour l’instant.</li>';
    return;
  }
  for (const h of history) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    const t = new Date(h.t);
    const span = document.createElement("span");
    span.className = "h-text";
    span.textContent = h.text;                    // textContent : pas d'injection HTML possible
    const time = document.createElement("span");
    time.className = "h-time";
    time.textContent = t.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " " +
                       t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    b.append(span, time);
    b.addEventListener("click", () => { showResult(h.text); setStatus(""); });
    li.appendChild(b);
    ul.appendChild(li);
  }
}

$("clear").addEventListener("click", () => { history = []; saveHistory(history); renderHistory(); });

renderHistory();

// Au chargement : la caméra live démarre toute seule
startCamera();

// Quand tu quittes l'appli (écran éteint, autre appli…), la page devient « cachée » :
// on coupe la caméra. Elle redémarre à ton retour, si elle tournait avant.
let resumeOnReturn = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    resumeOnReturn = looping;
    stopCamera();
    cancelAnimationFrame(animId);
  } else if (resumeOnReturn) {
    resumeOnReturn = false;
    startCamera();
  }
});

// Enregistre le service worker (sw.js) : rend l'appli installable et utilisable hors ligne
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* pas grave si ça échoue */ });
}
</script>
